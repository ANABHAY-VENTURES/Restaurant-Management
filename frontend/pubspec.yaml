name: restaurant_management
description: "Premium Restaurant Management Platform by Anabhay Ventures"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # UI / Charts
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  intl: any

  # HTTP
  dio: ^5.7.0

  # Local Storage
  shared_preferences: ^2.3.4

  # Utilities
  equatable: ^2.0.7
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
